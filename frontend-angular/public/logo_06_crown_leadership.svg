<?xml version="1.0" encoding="UTF-8"?>
<svg width="700" height="220" viewBox="0 0 700 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&amp;family=Montserrat:wght@700;800;900&amp;display=swap');
      .brand-title {
        font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
        font-size: 36px;
        font-weight: 900;
        letter-spacing: 3px;
        fill: #ffffff;
      }
      .brand-subtitle {
        font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 5px;
        fill: #38bdf8;
      }
    </style>
    
    <linearGradient id="gold_grad_06" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <linearGradient id="silver_grad_06" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <linearGradient id="blue_grad_06" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="navy_grad_06" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="emerald_grad_06" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="crimson_grad_06" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <filter id="shadow_06" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <filter id="glow_06" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Side: Emblem Symbol (160x160 area centered at X=100, Y=110) -->
  <g transform="translate(20, 30)" filter="url(#shadow_06)">
    
      <!-- Crown Top Accent -->
      <polygon points="80,10 70,36 90,36" fill="url(#gold_grad_06)" filter="url(#glow_06)" />
      <polygon points="50,22 48,40 62,40" fill="url(#gold_grad_06)" />
      <polygon points="110,22 98,40 112,40" fill="url(#gold_grad_06)" />

      <!-- Main Corporate A Body -->
      <path d="M 80 36 L 38 135 L 58 135 L 80 82 L 102 135 L 122 135 Z" fill="url(#silver_grad_06)" />
      <!-- Gold Leadership Band -->
      <rect x="52" y="88" width="56" height="12" rx="2" fill="url(#gold_grad_06)" />
    
  </g>

  <!-- Right Side: Corporate Stacked Typography -->
  <g transform="translate(200, 95)">
    <!-- Primary Brand Name: AATMANIRBHAR -->
    <text x="0" y="15" class="brand-title" filter="url(#shadow_06)">AATMANIRBHAR</text>

    <!-- Accent Divider Line -->
    <rect x="0" y="27" width="460" height="3.5" rx="1.75" fill="#0284c7" />

    <!-- Sub-heading: FACILITY MANAGEMENT PVT. LTD. -->
    <text x="0" y="48" class="brand-subtitle">FACILITY MANAGEMENT PVT. LTD.</text>
  </g>
</svg>