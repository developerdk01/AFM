<?xml version="1.0" encoding="UTF-8"?>
<svg width="660" height="140" viewBox="10 20 650 140" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&amp;display=swap');
      .brand-title {
        font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
        font-size: 50px;
        font-weight: 900;
        letter-spacing: 2px;
        fill: #ffffff;
      }
      .brand-subtitle {
        font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
        font-size: 19px;
        font-weight: 800;
        letter-spacing: 4.5px;
        fill: #38bdf8;
      }
    </style>
    
    <linearGradient id="silver_grad_08" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <linearGradient id="blue_grad_08" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <filter id="shadow_08" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Left Side: Delta Emblem (140x130 area) -->
  <g transform="translate(15, 20)" filter="url(#shadow_08)">
    <!-- Left Delta Facet -->
    <polygon points="75,10 15,130 68,130" fill="url(#blue_grad_08)" />
    <!-- Right Delta Facet -->
    <polygon points="75,10 135,130 82,130" fill="url(#silver_grad_08)" />
    <!-- Center Precision Slice -->
    <polygon points="75,50 54,112 96,112" fill="#061426" />
    <!-- Futuristic Energy Bar -->
    <line x1="40" y1="88" x2="110" y2="88" stroke="url(#blue_grad_08)" stroke-width="7" stroke-linecap="round" />
  </g>

  <!-- Right Side: Corporate Stacked Typography -->
  <g transform="translate(170, 45)">
    <!-- Primary Brand Name: AATMANIRBHAR -->
    <text x="0" y="42" class="brand-title" filter="url(#shadow_08)">AATMANIRBHAR</text>

    <!-- Accent Divider Line -->
    <rect x="0" y="58" width="480" height="4.5" rx="2.25" fill="#38bdf8" />

    <!-- Sub-heading: FACILITY MANAGEMENT PVT. LTD. -->
    <text x="0" y="85" class="brand-subtitle">FACILITY MANAGEMENT PVT. LTD.</text>
  </g>
</svg>