<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="200" viewBox="0 0 600 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad_primary_5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="grad_accent_5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="grad_gold_5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="grad_silver_5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <linearGradient id="grad_crimson_5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <filter id="shadow_5" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow_5" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Emblem (Left Side) -->
  <g transform="translate(25, 25)" filter="url(#shadow_5)">
    
      <!-- Outer Hexagon Frame -->
      <polygon points="75,10 130,40 130,105 75,135 20,105 20,40" fill="none" stroke="url(#grad_primary_5)" stroke-width="7" stroke-linejoin="round" />
      <!-- Inner Diamond Badge -->
      <polygon points="75,25 115,72 75,120 35,72" fill="#022c22" opacity="0.8" stroke="url(#grad_accent_5)" stroke-width="3" />
      <!-- Sharp A Core -->
      <path d="M 75 32 L 48 100 L 62 100 L 75 68 L 88 100 L 102 100 Z" fill="url(#grad_silver_5)" />
      <line x1="45" y1="72" x2="105" y2="72" stroke="url(#grad_primary_5)" stroke-width="6" stroke-linecap="round" />
    
  </g>

  <!-- Stacked Typography (Right Side) -->
  <g transform="translate(195, 85)">
    <!-- Main Company Name: AATMANIRBHAR (Large, Bold, Prominent) -->
    <text x="0" y="15" font-family="'Montserrat', 'Segoe UI', 'Arial', sans-serif" font-size="34" font-weight="900" letter-spacing="2" fill="#ffffff" filter="url(#shadow_5)">
      AATMANIRBHAR
    </text>
    
    <!-- Decorative Metallic/Accent Divider Line -->
    <rect x="0" y="27" width="370" height="3" rx="1.5" fill="url(#grad_accent_5)" />

    <!-- Sub-heading: FACILITY MANAGEMENT PVT. LTD. (Smaller font) -->
    <text x="0" y="48" font-family="'Montserrat', 'Segoe UI', 'Arial', sans-serif" font-size="14" font-weight="700" letter-spacing="4" fill="#38bdf8">
      FACILITY MANAGEMENT PVT. LTD.
    </text>
  </g>
</svg>