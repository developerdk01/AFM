<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="200" viewBox="0 0 600 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad_primary_10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="grad_accent_10" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="grad_gold_10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="grad_silver_10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <linearGradient id="grad_crimson_10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <filter id="shadow_10" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow_10" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Emblem (Left Side) -->
  <g transform="translate(25, 25)" filter="url(#shadow_10)">
    
      <!-- Cyber Circuit Outer Ring Segment -->
      <path d="M 75 10 A 65 65 0 0 1 140 75 A 65 65 0 0 1 75 140 A 65 65 0 0 1 10 75" fill="none" stroke="#00f2fe" stroke-width="4" stroke-dasharray="25 10 5 10" />
      <!-- Cyber Apex A -->
      <path d="M 75 20 L 32 120 L 52 120 L 75 68 L 98 120 L 118 120 Z" fill="url(#grad_silver_10)" />
      <!-- Neon Cyan Energy Crossbar Arrow -->
      <path d="M 38 78 L 132 78 L 118 64 M 132 78 L 118 92" fill="none" stroke="#00f2fe" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow_10)" />
      <circle cx="75" cy="45" r="5" fill="#00f2fe" filter="url(#glow_10)" />
    
  </g>

  <!-- Stacked Typography (Right Side) -->
  <g transform="translate(195, 85)">
    <!-- Main Company Name: AATMANIRBHAR (Large, Bold, Prominent) -->
    <text x="0" y="15" font-family="'Montserrat', 'Segoe UI', 'Arial', sans-serif" font-size="34" font-weight="900" letter-spacing="2" fill="#ffffff" filter="url(#shadow_10)">
      AATMANIRBHAR
    </text>
    
    <!-- Decorative Metallic/Accent Divider Line -->
    <rect x="0" y="27" width="370" height="3" rx="1.5" fill="url(#grad_accent_10)" />

    <!-- Sub-heading: FACILITY MANAGEMENT PVT. LTD. (Smaller font) -->
    <text x="0" y="48" font-family="'Montserrat', 'Segoe UI', 'Arial', sans-serif" font-size="14" font-weight="700" letter-spacing="4" fill="#38bdf8">
      FACILITY MANAGEMENT PVT. LTD.
    </text>
  </g>
</svg>