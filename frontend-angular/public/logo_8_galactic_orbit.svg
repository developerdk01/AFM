<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="200" viewBox="0 0 600 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad_primary_8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="grad_accent_8" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="grad_gold_8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="grad_silver_8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <linearGradient id="grad_crimson_8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <filter id="shadow_8" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow_8" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Emblem (Left Side) -->
  <g transform="translate(25, 25)" filter="url(#shadow_8)">
    
      <!-- Back Orbit Ring -->
      <path d="M 15 85 C 10 65, 50 35, 105 30" fill="none" stroke="url(#grad_accent_8)" stroke-width="6" opacity="0.4" />
      <!-- Central Metallic A -->
      <path d="M 75 18 L 38 125 L 58 125 L 75 72 L 92 125 L 112 125 Z" fill="url(#grad_gold_8)" />
      <line x1="48" y1="82" x2="102" y2="82" stroke="#ffffff" stroke-width="7" stroke-linecap="round" />
      <!-- Front Glowing Orbit Ring -->
      <path d="M 105 30 C 135 27, 140 55, 95 85 C 55 110, 20 100, 25 80" fill="none" stroke="url(#grad_accent_8)" stroke-width="7" stroke-linecap="round" filter="url(#glow_8)" />
      <circle cx="100" cy="82" r="6" fill="#ffffff" />
    
  </g>

  <!-- Stacked Typography (Right Side) -->
  <g transform="translate(195, 85)">
    <!-- Main Company Name: AATMANIRBHAR (Large, Bold, Prominent) -->
    <text x="0" y="15" font-family="'Montserrat', 'Segoe UI', 'Arial', sans-serif" font-size="34" font-weight="900" letter-spacing="2" fill="#ffffff" filter="url(#shadow_8)">
      AATMANIRBHAR
    </text>
    
    <!-- Decorative Metallic/Accent Divider Line -->
    <rect x="0" y="27" width="370" height="3" rx="1.5" fill="url(#grad_accent_8)" />

    <!-- Sub-heading: FACILITY MANAGEMENT PVT. LTD. (Smaller font) -->
    <text x="0" y="48" font-family="'Montserrat', 'Segoe UI', 'Arial', sans-serif" font-size="14" font-weight="700" letter-spacing="4" fill="#38bdf8">
      FACILITY MANAGEMENT PVT. LTD.
    </text>
  </g>
</svg>