<?xml version="1.0" encoding="UTF-8"?>
<svg width="700" height="220" viewBox="0 0 700 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&amp;family=Montserrat:wght@700;800;900&amp;display=swap');
      .brand-title {
        font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
        font-size: 36px;
        font-weight: 900;
        letter-spacing: 3px;
        fill: #ffffff;
      }
      .brand-subtitle {
        font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 5px;
        fill: #38bdf8;
      }
    </style>
    
    <linearGradient id="gold_grad_05" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <linearGradient id="silver_grad_05" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <linearGradient id="blue_grad_05" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="navy_grad_05" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="emerald_grad_05" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="crimson_grad_05" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <filter id="shadow_05" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <filter id="glow_05" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Side: Emblem Symbol (160x160 area centered at X=100, Y=110) -->
  <g transform="translate(20, 30)" filter="url(#shadow_05)">
    
      <!-- Outer Double Golden Ring Seal -->
      <circle cx="80" cy="80" r="68" fill="none" stroke="url(#gold_grad_05)" stroke-width="6" />
      <circle cx="80" cy="80" r="58" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="6 4" />
      <circle cx="80" cy="80" r="50" fill="#061221" />

      <!-- Symmetrical 4-Pillar A Motif -->
      <path d="M 80 35 L 48 115 L 62 115 L 80 70 L 98 115 L 112 115 Z" fill="url(#silver_grad_05)" />
      <!-- Horizontal Golden Governance Star -->
      <polygon points="80,56 86,70 102,70 89,80 94,95 80,85 66,95 71,80 58,70 74,70" fill="url(#gold_grad_05)" />
    
  </g>

  <!-- Right Side: Corporate Stacked Typography -->
  <g transform="translate(200, 95)">
    <!-- Primary Brand Name: AATMANIRBHAR -->
    <text x="0" y="15" class="brand-title" filter="url(#shadow_05)">AATMANIRBHAR</text>

    <!-- Accent Divider Line -->
    <rect x="0" y="27" width="460" height="3.5" rx="1.75" fill="#ffffff" />

    <!-- Sub-heading: FACILITY MANAGEMENT PVT. LTD. -->
    <text x="0" y="48" class="brand-subtitle">FACILITY MANAGEMENT PVT. LTD.</text>
  </g>
</svg>