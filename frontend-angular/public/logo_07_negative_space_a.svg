<?xml version="1.0" encoding="UTF-8"?>
<svg width="700" height="220" viewBox="0 0 700 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&amp;family=Montserrat:wght@700;800;900&amp;display=swap');
      .brand-title {
        font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
        font-size: 36px;
        font-weight: 900;
        letter-spacing: 3px;
        fill: #ffffff;
      }
      .brand-subtitle {
        font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 5px;
        fill: #38bdf8;
      }
    </style>
    
    <linearGradient id="gold_grad_07" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <linearGradient id="silver_grad_07" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <linearGradient id="blue_grad_07" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="navy_grad_07" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="emerald_grad_07" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="crimson_grad_07" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <filter id="shadow_07" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <filter id="glow_07" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Side: Emblem Symbol (160x160 area centered at X=100, Y=110) -->
  <g transform="translate(20, 30)" filter="url(#shadow_07)">
    
      <!-- Solid Hexagon Base -->
      <polygon points="80,12 138,45 138,115 80,148 22,115 22,45" fill="url(#blue_grad_07)" />
      
      <!-- Negative Space Cutouts forming A & Arrow -->
      <polygon points="80,32 45,110 60,110 80,68 100,110 115,110" fill="#061325" />
      <polygon points="80,48 65,85 95,85" fill="url(#silver_grad_07)" />
      <rect x="72" y="85" width="16" height="35" fill="url(#silver_grad_07)" />
    
  </g>

  <!-- Right Side: Corporate Stacked Typography -->
  <g transform="translate(200, 95)">
    <!-- Primary Brand Name: AATMANIRBHAR -->
    <text x="0" y="15" class="brand-title" filter="url(#shadow_07)">AATMANIRBHAR</text>

    <!-- Accent Divider Line -->
    <rect x="0" y="27" width="460" height="3.5" rx="1.75" fill="#38bdf8" />

    <!-- Sub-heading: FACILITY MANAGEMENT PVT. LTD. -->
    <text x="0" y="48" class="brand-subtitle">FACILITY MANAGEMENT PVT. LTD.</text>
  </g>
</svg>